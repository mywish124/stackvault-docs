<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stronkey</title>
    <style>
        body {
            background-color: #0d0f11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1a1c20;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h2 { margin-top: 0; color: #b388ff; }
        .secret-box {
            background-color: #0a2416;
            color: #00e676;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: left;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: monospace;
            display: none;
        }
        .warning {
            color: #a0a0a0;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .error { color: #ff3b5c; display: none; margin-top: 20px; font-weight: bold;}
        .loading { color: #888888; }
        button {
            background-color: #252525;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            display: none;
            width: 100%;
        }
        button:hover { background-color: #353535; }
    </style>
</head>
<body>

<div class="container">
    <h2>Сгорающее сообщение</h2>
    
    <div id="loading" class="loading">Расшифровка ссылки...</div>
    
    <div id="secretBox" class="secret-box"></div>
    
    <p id="warningText" class="warning" style="display:none;">
        ⚠️ Это сообщение было безвозвратно удалено с серверов. Сохраните данные прямо сейчас. При обновлении страницы они исчезнут навсегда.
    </p>

    <div id="errorBox" class="error">Сообщение не найдено или уже было прочитано.</div>

    <button id="copyBtn" onclick="copyText()">Скопировать текст</button>
</div>

<script>
    const SUPABASE_URL = 'https://bodulninkbreenab.beget.app';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzc3NjgwMDAwLCJleHAiOjIxMTQzNzc2MDB9.eKAZKevdQVPVQp_KLKhx9qodDmBl-hgfp_1nA_Yhn2o';

    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const secretId = urlParams.get('id');

        if (!secretId) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorBox').style.display = 'block';
            document.getElementById('errorBox').innerText = 'Неверная ссылка. ID отсутствует.';
            return;
        }

        fetch(`${SUPABASE_URL}/rest/v1/rpc/read_secret_link`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({ p_id: secretId })
        })
        .then(response => {
            if (!response.ok) throw new Error('Сбой API');
            return response.json();
        })
        .then(data => {
            document.getElementById('loading').style.display = 'none';
            
            if (data) {
                const secretBox = document.getElementById('secretBox');
                secretBox.textContent = data;
                secretBox.style.display = 'block';
                document.getElementById('warningText').style.display = 'block';
                document.getElementById('copyBtn').style.display = 'block';
            } else {
                document.getElementById('errorBox').style.display = 'block';
            }
        })
        .catch(err => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorBox').style.display = 'block';
        });
    });

    function copyText() {
        const text = document.getElementById('secretBox').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.textContent = 'Скопировано!';
            setTimeout(() => btn.textContent = 'Скопировать текст', 2000);
        });
    }
</script>

</body>
</html>
