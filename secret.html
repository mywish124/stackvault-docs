<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моментальное сообщение</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #000000;
            border: 3px solid #ffffff;
            box-shadow: 10px 10px 0px #ffffff;
            max-width: 440px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
        }
        .header {
            font-size: 22px;
            font-weight: 900;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .divider {
            height: 2px;
            background-color: #ffffff;
            width: 100%;
            margin-bottom: 25px;
        }
        .secret-container {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }
        .secret-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .secret-line {
            height: 1px;
            background-color: #000000;
            width: 100%;
            margin-bottom: 12px;
        }
        .secret-text {
            font-family: monospace;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.4;
        }
        .warning-box {
            background-color: #000000;
            border: 2px solid #ffffff;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .warning-icon {
            font-size: 16px;
            line-height: 1;
        }
        .warning-text {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.4;
            text-align: left;
        }
        .action-button {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            width: 100%;
            padding: 16px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #ffffff;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .action-button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #ffffff;
        }
        .status-message {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 30px 10px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">МОМЕНТАЛЬНОЕ СООБЩЕНИЕ</div>
    <div class="divider"></div>

    <div id="loadingState" class="status-message">Расшифровка ссылки...</div>

    <div id="contentState" class="hidden">
        <div class="secret-container">
            <div class="secret-label">Секретные данные:</div>
            <div class="secret-line"></div>
            <div id="secretText" class="secret-text"></div>
        </div>

        <div class="warning-box">
            <div class="warning-icon">⚠️</div>
            <div class="warning-text">ЭТО ОДНОРАЗОВОЕ СООБЩЕНИЕ. ПОСЛЕ ВЫХОДА СО СТРАНИЦЫ ИЛИ ЕЁ ОБНОВЛЕНИЯ ОНО ИСЧЕЗНЕТ.</div>
        </div>

        <button id="copyBtn" class="action-button" onclick="copyText()">Скопировать текст</button>
    </div>

    <div id="errorState" class="status-message hidden">
        Сообщение не найдено или уже было прочтено.
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://bodulninkbreenab.beget.app';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzc3NjgwMDAwLCJleHAiOjIxMTQzNzc2MDB9.eKAZKevdQVPVQp_KLKhx9qodDmBl-hgfp_1nA_Yhn2o';

    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const secretId = urlParams.get('id');

        if (!secretId) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.remove('hidden');
            return;
        }

        fetch(`${SUPABASE_URL}/rest/v1/rpc/read_secret_link`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({ p_id: secretId })
        })
        .then(response => {
            if (!response.ok) throw new Error('API Error');
            return response.json();
        })
        .then(data => {
            document.getElementById('loadingState').classList.add('hidden');
            
            if (data) {
                document.getElementById('secretText').textContent = data;
                document.getElementById('contentState').classList.remove('hidden');
            } else {
                document.getElementById('errorState').classList.remove('hidden');
            }
        })
        .catch(err => {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.remove('hidden');
        });
    });

    function copyText() {
        const text = document.getElementById('secretText').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.textContent = 'Скопировано!';
            setTimeout(() => btn.textContent = 'Скопировать текст', 2000);
        });
    }
</script>

</body>
</html>
